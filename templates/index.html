<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🤖 Code Explainer Bot</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 10px;
    }

    .chat-container {
      background-color: #ffffff;
      max-width: 700px;
      width: 100%;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .header {
      font-size: 1.5rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }

    .header span {
      margin-left: 10px;
    }

    .message {
      padding: 15px;
      border-radius: 12px;
      margin: 10px 0;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .bot {
      background-color: #e0f3ff;
      align-self: flex-start;
    }

    .user {
      background-color: #d3f8d3;
      text-align: right;
      align-self: flex-end;
    }

    textarea {
      width: 100%;
      height: 160px;
      font-size: 14px;
      font-family: monospace;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 20px;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      background-color: #0077ff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005ed1;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9rem;
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="header">🤖 <span>Welcome to Code Explainer Bot!</span></div>

    <div class="message bot">
      👋 Hey there! Paste your 🧠 code below and I’ll tell you what it does, in plain English! ✨
    </div>

    <form method="POST">
      <textarea name="code" placeholder="✍️ Paste your code here..."></textarea>
      <button type="submit">🔍 Explain My Code</button>
    </form>

    {% if user_code %}
      <div class="message user">
        👨‍💻 Your Code:<br>{{ user_code }}
      </div>
    {% endif %}

    {% if explanation %}
      <div class="message bot">
        🧠 Explanation:<br>{{ explanation }}
      </div>
    {% endif %}

    <div class="footer">
      🚀 Powered by OpenAI | 🛠️ Built By Susheeth
    </div>
  </div>

</body>
</html>
